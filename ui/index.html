<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Compatible Companion</title>
  <link rel="stylesheet" href="/ui/style.css" />
</head>
<body>
  <header class="top">
    <div class="title">
      <h1>Compatible Companion</h1>
      <div class="sub">Local-first companion. Ollama-backed. Signed receipts. Capsule export.</div>
    </div>

    <div class="status" id="status">
      <div class="pill" id="pill-server">server: ?</div>
      <div class="pill" id="pill-llm">llm: ?</div>
      <div class="pill" id="pill-policy">policy: ?</div>
    </div>
  </header>

  <main class="grid">
    <section class="card">
      <h2>Chat</h2>
      <div class="row">
        <input id="input" placeholder="Say something…" autocomplete="off" />
        <button id="send">Send</button>
      </div>
      <div class="row">
        <button id="tail">Tail</button>
        <button id="export">Export Capsule</button>
        <button id="docs">Docs</button>
      </div>

      <div class="chat" id="chat"></div>
    </section>

    <section class="card">
      <h2>Receipts (latest)</h2>
      <pre class="mono" id="receipts"></pre>
    </section>

    <section class="card">
      <h2>LLM</h2>

      <div class="row">
        <label class="lbl">Model</label>
        <select id="model"></select>
      </div>

      <div class="row">
        <button id="applyModel">Apply Model</button>
        <button id="refreshModels">Refresh List</button>
      </div>

      <pre class="mono" id="llm"></pre>
    </section>
  </main>

  <script src="/ui/app.js"></script>
</body>
</html>
